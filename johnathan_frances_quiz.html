<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frances and Jonathan · Phone quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EFEFEF; --surface: #FFFFFF; --ink: #2E2E2E; --muted: #5A5A5A; --line: #D0D0D0;
  --a1: #E3ECF7; --a1i: #3D628F; --a2: #E2F0E5; --a2i: #3F7350;
  --a3: #ECE6F5; --a3i: #664A8C; --a4: #F7E9DE; --a4i: #9A5630;
  --right: #2F7A4F; --rightbg: #DCF0E3; --wrong: #A33F4F; --wrongbg: #F7E0E4;
  --ring: #5B7FA8;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1F21; --surface: #2A2B2E; --ink: #EDEDED; --muted: #B5B5B5; --line: #44464A;
    --a1: #2A3646; --a1i: #A9C3E6; --a2: #263A2D; --a2i: #A6D3B2;
    --a3: #342B42; --a3i: #CDB8EC; --a4: #43311F; --a4i: #EDC09E;
    --right: #8FD8A9; --rightbg: #22392A; --wrong: #F0A3AF; --wrongbg: #45262B;
    --ring: #A9C3E6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1F21; --surface: #2A2B2E; --ink: #EDEDED; --muted: #B5B5B5; --line: #44464A;
  --a1: #2A3646; --a1i: #A9C3E6; --a2: #263A2D; --a2i: #A6D3B2;
  --a3: #342B42; --a3i: #CDB8EC; --a4: #43311F; --a4i: #EDC09E;
  --right: #8FD8A9; --rightbg: #22392A; --wrong: #F0A3AF; --wrongbg: #45262B;
  --ring: #A9C3E6;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font-family: "Lexend", Calibri, Carlito, "Segoe UI", Arial, sans-serif;
  font-size: 18px; line-height: 1.45;
}
main { max-width: 34rem; margin: 0 auto; padding: 1.25rem 1rem 2rem; }
h1 { font-size: 1.9rem; line-height: 1.15; margin: 1.5rem 0 0.5rem; font-weight: 700; }
p { margin: 0 0 1rem; }
.muted { color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 1.25rem; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--ring); outline-offset: 3px; }
.primary {
  width: 100%; border: 0; border-radius: 14px; padding: 1rem; font-weight: 600; font-size: 1.1rem;
  background: var(--ink); color: var(--bg); margin-top: 1rem;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
.count { font-weight: 600; }
.dots { display: flex; gap: 6px; margin-top: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dot.ok { background: var(--right); }
.dot.no { background: var(--wrong); }
.dot.now { background: var(--ink); }
.timer { position: relative; width: 64px; height: 64px; flex: none; }
.timer svg { transform: rotate(-90deg); }
.timer .track { stroke: var(--line); }
.timer .bar { stroke: var(--ring); transition: stroke-dashoffset 1s linear; }
.timer span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 1.2rem; }
.question { font-size: 1.45rem; font-weight: 600; line-height: 1.3; margin: 0.25rem 0 1.25rem; }
.answers { display: grid; gap: 0.75rem; }
.answer {
  display: flex; align-items: center; gap: 0.85rem; text-align: left; width: 100%;
  border: 2px solid transparent; border-radius: 14px; padding: 0.95rem 1rem; min-height: 64px; font-size: 1.1rem;
}
.answer .shape { width: 26px; height: 26px; flex: none; display: grid; place-items: center; font-weight: 700; }
.answer:nth-child(1) { background: var(--a1); color: var(--a1i); }
.answer:nth-child(2) { background: var(--a2); color: var(--a2i); }
.answer:nth-child(3) { background: var(--a3); color: var(--a3i); }
.answer:nth-child(4) { background: var(--a4); color: var(--a4i); }
.answer .label { color: var(--ink); }
.answer[disabled] { cursor: default; }
.answer.dim { opacity: 0.45; }
.answer.right { background: var(--rightbg); border-color: var(--right); opacity: 1; }
.answer.right .shape { color: var(--right); }
.answer.wrong { background: var(--wrongbg); border-color: var(--wrong); opacity: 1; }
.answer.wrong .shape { color: var(--wrong); }
.feedback { margin-top: 1rem; font-weight: 600; min-height: 1.5rem; }
.feedback.ok { color: var(--right); }
.feedback.no { color: var(--wrong); }
.score { font-size: 4.5rem; font-weight: 700; line-height: 1; margin: 1rem 0 0.25rem; }
.list { margin: 1rem 0 0; padding: 0; list-style: none; }
.list li { padding: 0.6rem 0; border-top: 1px solid var(--line); display: flex; gap: 0.6rem; }
.list li:first-child { border-top: 0; }
.list .mark { font-weight: 700; flex: none; width: 1.2rem; }
.list .mark.ok { color: var(--right); }
.list .mark.no { color: var(--wrong); }
.phone { margin-top: 1.25rem; padding: 1rem; border-radius: 14px; background: var(--a2); color: var(--a2i); font-weight: 600; }
.hidden { display: none; }
@media (prefers-reduced-motion: reduce) { .timer .bar { transition: none; } }
</style>
</head>
<body>
<main>
  <section id="start">
    <h1>Frances and Jonathan</h1>
    <p class="muted">Eight quick questions on lines 1-17. You get 20 seconds for each one.</p>
    <div class="panel">
      <p>Tap the answer you think is right. You’ll see straight away if you got it.</p>
      <p class="muted" style="margin:0">Only use lines 1-17.</p>
    </div>
    <button class="primary" id="go">Start the quiz</button>
  </section>

  <section id="play" class="hidden" aria-live="polite">
    <div class="top">
      <div>
        <div class="count" id="count">Question 1 of 8</div>
        <div class="dots" id="dots" aria-hidden="true"></div>
      </div>
      <div class="timer" aria-label="Time left">
        <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
          <circle class="track" cx="32" cy="32" r="27" fill="none" stroke-width="6"/>
          <circle class="bar" id="bar" cx="32" cy="32" r="27" fill="none" stroke-width="6" stroke-linecap="round"/>
        </svg>
        <span id="secs">20</span>
      </div>
    </div>
    <p class="question" id="q"></p>
    <div class="answers" id="answers"></div>
    <p class="feedback" id="fb"></p>
    <button class="primary hidden" id="next">Next question</button>
  </section>

  <section id="end" class="hidden">
    <h1>Done</h1>
    <div class="score" id="score">0</div>
    <p class="muted" id="outof">out of 8</p>
    <div class="panel">
      <ul class="list" id="review"></ul>
    </div>
    <div class="phone">📱 Phone face down now. Route work starts.</div>
    <button class="primary" id="again">Try the quiz again</button>
  </section>
</main>

<script>
const QUIZ = [
  { q: "What has Jonathan just changed?", a: ["Lorna’s sandals", "Matthew’s nappy", "The baby’s bottle", "Matthew’s clothes"], c: 1 },
  { q: "Which toy does Lorna want?", a: ["The dinosaur", "The bear", "The spider", "The beads"], c: 2 },
  { q: "Who is fed up with having to plan everything?", a: ["Frances", "Jonathan", "Lorna", "Matthew"], c: 0 },
  { q: "What time does Lorna wake up?", a: ["1 a.m.", "4 a.m.", "7 a.m.", "6.30 a.m."], c: 3 },
  { q: "Where are they going?", a: ["A theme park", "The cottage where Thomas Hardy was born", "The zoo", "A friend’s house"], c: 1 },
  { q: "How does Jonathan look while he picks up the toys?", a: ["Happy", "Sleepy", "Cross", "Scared"], c: 2 },
  { q: "Which word shows that Frances is tired?", a: ["fatigue", "freedom", "congratulations", "mess"], c: 0 },
  { q: "What does Jonathan keep asking at the end of lines 1-17?", a: ["Where are the car keys?", "Have we got the nappies?", "Who’s driving?", "Are we ready to go?"], c: 3 },
];
const SHAPES = ["▲", "◆", "●", "■"];
const TIME = 20, R = 27, C = 2 * Math.PI * R;
const $ = (id) => document.getElementById(id);
const bar = $("bar"); bar.style.strokeDasharray = C;

let i = 0, score = 0, results = [], left = TIME, tick = null, locked = false;

function show(id) { ["start", "play", "end"].forEach((s) => $(s).classList.toggle("hidden", s !== id)); window.scrollTo(0, 0); }

function dots() {
  $("dots").innerHTML = QUIZ.map((_, k) => {
    const r = results[k];
    const cls = r === undefined ? (k === i ? "now" : "") : (r.ok ? "ok" : "no");
    return `<span class="dot ${cls}"></span>`;
  }).join("");
}

function setTimer() {
  $("secs").textContent = left;
  bar.style.strokeDashoffset = C * (1 - left / TIME);
}

function load() {
  locked = false;
  const item = QUIZ[i];
  $("count").textContent = `Question ${i + 1} of ${QUIZ.length}`;
  $("q").textContent = item.q;
  $("fb").textContent = ""; $("fb").className = "feedback";
  $("next").classList.add("hidden");
  $("answers").innerHTML = "";
  item.a.forEach((txt, k) => {
    const b = document.createElement("button");
    b.className = "answer";
    b.innerHTML = `<span class="shape" aria-hidden="true">${SHAPES[k]}</span><span class="label"></span>`;
    b.querySelector(".label").textContent = txt;
    b.addEventListener("click", () => answer(k));
    $("answers").appendChild(b);
  });
  dots();
  left = TIME;
  bar.style.transition = "none"; setTimer(); void bar.offsetWidth; bar.style.transition = "";
  clearInterval(tick);
  tick = setInterval(() => { left--; setTimer(); if (left <= 0) answer(null); }, 1000);
}

function answer(k) {
  if (locked) return;
  locked = true; clearInterval(tick);
  const item = QUIZ[i], ok = k === item.c;
  if (ok) score++;
  results[i] = { ok, picked: k };
  [...$("answers").children].forEach((b, n) => {
    b.disabled = true;
    if (n === item.c) { b.classList.add("right"); b.querySelector(".shape").textContent = "✓"; }
    else if (n === k) { b.classList.add("wrong"); b.querySelector(".shape").textContent = "✗"; }
    else b.classList.add("dim");
  });
  const fb = $("fb");
  if (ok) { fb.textContent = "Right!"; fb.className = "feedback ok"; }
  else if (k === null) { fb.textContent = `Out of time. The answer is: ${item.a[item.c]}`; fb.className = "feedback no"; }
  else { fb.textContent = `Not this time. The answer is: ${item.a[item.c]}`; fb.className = "feedback no"; }
  dots();
  const nx = $("next");
  nx.textContent = i === QUIZ.length - 1 ? "See my score" : "Next question";
  nx.classList.remove("hidden"); nx.focus({ preventScroll: true });
}

function finish() {
  $("score").textContent = score;
  $("outof").textContent = `out of ${QUIZ.length}`;
  $("review").innerHTML = "";
  QUIZ.forEach((item, k) => {
    const li = document.createElement("li"), r = results[k];
    li.innerHTML = `<span class="mark ${r.ok ? "ok" : "no"}" aria-label="${r.ok ? "right" : "wrong"}">${r.ok ? "✓" : "✗"}</span><span></span>`;
    li.lastChild.textContent = `${item.q} ${item.a[item.c]}`;
    $("review").appendChild(li);
  });
  show("end");
}

$("go").addEventListener("click", () => { i = 0; score = 0; results = []; show("play"); load(); });
$("next").addEventListener("click", () => { if (i < QUIZ.length - 1) { i++; load(); } else finish(); });
$("again").addEventListener("click", () => { i = 0; score = 0; results = []; show("play"); load(); });
</script>
</body>
</html>
