<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Detective</title>
<style>
  :root { --navy:#1F2A44; --coral:#FF6F61; --yellow:#FFC845; --light:#F4F5F8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Calibri, Carlito, "Segoe UI", Arial, sans-serif; background:var(--navy); color:#fff; min-height:100vh; display:flex; flex-direction:column; }
  header { display:flex; justify-content:space-between; align-items:center; padding:16px 28px; }
  h1 { margin:0; font-size:2rem; }
  .chip { background:var(--yellow); color:var(--navy); font-weight:bold; padding:6px 16px; border-radius:20px; font-size:1.2rem; }
  main { flex:1; display:flex; flex-direction:column; align-items:center; padding:10px 28px 28px; }
  .card { background:#fff; color:var(--navy); border-radius:16px; padding:32px; width:100%; max-width:1100px; text-align:center; font-size:2.4rem; font-weight:bold; min-height:170px; display:flex; align-items:center; justify-content:center; }
  .hint { margin:14px 0; font-size:1.3rem; opacity:.85; text-align:center; }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; width:100%; max-width:1100px; }
  button.opt { font:inherit; font-size:1.4rem; padding:16px; border:none; border-radius:12px; background:var(--light); color:var(--navy); cursor:pointer; font-weight:bold; }
  button.opt:hover { outline:4px solid var(--yellow); }
  button.opt.right { background:#7BD389; }
  button.opt.wrong { background:var(--coral); color:#fff; }
  .feedback { margin-top:16px; font-size:1.6rem; min-height:2em; text-align:center; }
  .controls { margin-top:10px; display:flex; gap:12px; }
  .controls button { font:inherit; font-size:1.3rem; padding:12px 26px; border:none; border-radius:30px; background:var(--coral); color:#fff; cursor:pointer; font-weight:bold; }
  .controls button.alt { background:transparent; border:2px solid #fff; }
</style>
</head>
<body>
<header>
  <h1>Device Detective</h1>
  <span class="chip" id="progress">1 / 9</span>
</header>
<main>
  <div class="card" id="sentence"></div>
  <div class="hint"><strong id="devcount"></strong> Shout it out, write it down, or click it.</div>
  <div class="grid" id="options"></div>
  <div class="feedback" id="feedback"></div>
  <div class="controls">
    <button class="alt" id="reveal">Reveal</button>
    <button id="next">Next</button>
  </div>
</main>
<script>
const DEVICES = ["Rhetorical questions","Alliteration","Personal pronouns","Facts","Opinions","Repetition","Emotive language","Statistics","Rule of three"];
const ITEMS = [
  { s: "Is there anything worse than a phone that dies?", a: ["Rhetorical questions"] },
  { s: "Gaming is good, gripping fun.", a: ["Alliteration","Opinions"] },
  { s: "We have all been there, and you know how it feels.", a: ["Personal pronouns"] },
  { s: "Mondays come round every single week.", a: ["Facts"] },
  { s: "I think cooking is the best hobby there is.", a: ["Opinions","Personal pronouns"] },
  { s: "Again and again and again, the alarm goes off.", a: ["Repetition"] },
  { s: "Hearts sink when the queue goes out of the door.", a: ["Emotive language"] },
  { s: "In my class survey, 9 out of 10 people hate Mondays. (made-up example)", a: ["Statistics"] },
  { s: "Video games are fast, fun and friendly.", a: ["Rule of three","Alliteration","Opinions"] }
];
let i = 0, found = [];
const $ = id => document.getElementById(id);
const count = n => n === 1 ? "1 device" : n + " devices";
function show() {
  found = [];
  const item = ITEMS[i];
  $("sentence").textContent = "\u201C" + item.s + "\u201D";
  $("progress").textContent = (i + 1) + " / " + ITEMS.length;
  $("devcount").textContent = "This sentence has " + count(item.a.length) + ".";
  $("feedback").textContent = "";
  $("options").innerHTML = "";
  DEVICES.forEach(d => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = d;
    b.onclick = () => pick(b, d);
    $("options").appendChild(b);
  });
}
function pick(btn, d) {
  const item = ITEMS[i];
  if (item.a.includes(d)) {
    btn.classList.add("right");
    if (!found.includes(d)) found.push(d);
    const left = item.a.length - found.length;
    $("feedback").textContent = left === 0
      ? (item.a.length > 1 ? "You found them all! " : "Yes! ") + "That's " + item.a.map(x => x.toLowerCase()).join(" and ") + "."
      : "Yes, " + d.toLowerCase() + "! There's " + count(left) + " more to find.";
  } else {
    btn.classList.add("wrong");
    $("feedback").textContent = "Not that one. Try again, or press Reveal.";
  }
}
$("reveal").onclick = () => {
  [...$("options").children].forEach(b => { if (ITEMS[i].a.includes(b.textContent)) b.classList.add("right"); });
  $("feedback").textContent = "It's " + ITEMS[i].a.map(x => x.toLowerCase()).join(" and ") + ".";
};
$("next").onclick = () => { i = (i + 1) % ITEMS.length; show(); };
show();
</script>
</body>
</html>
