<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDEAE1;
    --card: #FAF8F3;
    --ink: #262B22;
    --ink-soft: #5B6156;
    --line: #D9D4C6;
    --accent: #4B5C4A;
    --good: #3F6B4A;
    --good-bg: #E4EFE3;
    --good-border: #A9C7A7;
    --bad: #96432F;
    --bad-bg: #F3E4DE;
    --bad-border: #DDB4A4;
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: var(--font-sans); color: var(--ink); }
  .page { max-width: 600px; margin: 0 auto; padding: 48px 24px 64px; }
  header { text-align: center; margin-bottom: 28px; }
  .eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 8px; }
  h1 { font-family: var(--font-display); font-weight: 500; font-size: 28px; margin: 0 0 10px; }
  .wordlist { font-size: 13px; color: var(--ink-soft); margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .frame-top { height: 14px; border-bottom: 1px solid var(--line); background-image: repeating-linear-gradient(90deg, var(--line) 0, var(--line) 1px, transparent 1px, transparent 48px); }
  #quiz-root { padding: 28px 28px 32px; }

  .progress { display: flex; gap: 6px; margin-bottom: 20px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .dot.done { background: var(--accent); }
  .dot.current { background: var(--ink); }

  .counter { font-size: 12px; color: var(--ink-soft); margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  .word { font-family: var(--font-display); font-size: 24px; font-weight: 500; margin: 0 0 6px; }
  .prompt { font-size: 15px; color: var(--ink-soft); margin: 0 0 18px; }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option { text-align: left; font-family: var(--font-sans); font-size: 15px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); cursor: pointer; transition: border-color .15s, background .15s; }
  .option:hover:not(:disabled) { border-color: var(--accent); }
  .option:disabled { cursor: default; }
  .option.correct { background: var(--good-bg); border-color: var(--good-border); color: var(--good); }
  .option.incorrect { background: var(--bad-bg); border-color: var(--bad-border); color: var(--bad); }

  .feedback { margin-top: 16px; padding: 12px 16px; border-radius: 10px; font-size: 14px; display: none; border-left: 3px solid currentColor; }
  .feedback.good { display: block; background: var(--good-bg); color: var(--good); }
  .feedback.bad { display: block; background: var(--bad-bg); color: var(--bad); }

  .next { margin-top: 20px; display: none; font-family: var(--font-sans); font-size: 14px; font-weight: 500; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; }
  .next:hover { opacity: 0.9; }

  .score { font-family: var(--font-display); font-size: 22px; margin: 0 0 18px; }
  .review-row { padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; background: #fff; }
  .review-word { font-weight: 600; margin: 0 0 2px; font-size: 14px; }
  .review-def { margin: 0; font-size: 13px; color: var(--ink-soft); }
  .restart { margin-top: 6px; font-family: var(--font-sans); font-size: 14px; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  .restart:hover { border-color: var(--accent); }
</style>
</head>
<body>
<div class="page">
  <header>
    <p class="eyebrow">Vocabulary check</p>
    <h1>Five words, five questions</h1>
    <p class="wordlist">tranquil &middot; pristine &middot; mullioned windows &middot; undertaker &middot; in profile</p>
  </header>
  <div class="card">
    <div class="frame-top"></div>
    <div id="quiz-root"></div>
  </div>
</div>
<script>
(function () {
  var questions = [
    {
      word: "Tranquil",
      prompt: "Tranquil most nearly means...",
      explanation: "Tranquil describes a calm, quiet, undisturbed state.",
      options: [
        { text: "Calm and peaceful", correct: true },
        { text: "Loud and chaotic", correct: false },
        { text: "Extremely large", correct: false },
        { text: "Broken or damaged", correct: false }
      ]
    },
    {
      word: "Pristine",
      prompt: "Pristine most nearly means...",
      explanation: "Pristine describes something spotless or in its original, untouched condition.",
      options: [
        { text: "Worn and dirty", correct: false },
        { text: "Clean and unspoiled, as if new", correct: true },
        { text: "Old-fashioned in style", correct: false },
        { text: "Brightly colored", correct: false }
      ]
    },
    {
      word: "Mullioned windows",
      prompt: "Mullioned windows are windows that...",
      explanation: "A mullion is the strip of frame that divides a window into separate panes.",
      options: [
        { text: "Have no glass at all", correct: false },
        { text: "Are divided into smaller panes by vertical or horizontal bars", correct: true },
        { text: "Open outward like doors", correct: false },
        { text: "Are permanently sealed shut", correct: false }
      ]
    },
    {
      word: "Undertaker",
      prompt: "An undertaker is someone whose job is to...",
      explanation: "An undertaker, also called a funeral director, prepares bodies and arranges funeral services.",
      options: [
        { text: "Dig wells and irrigation channels", correct: false },
        { text: "Manage ships in a harbor", correct: false },
        { text: "Prepare the dead for burial and arrange funerals", correct: true },
        { text: "Restore damaged paintings", correct: false }
      ]
    },
    {
      word: "In profile",
      prompt: "If a portrait shows a face 'in profile,' the face is...",
      explanation: "In profile means viewed from the side, showing the outline of the face.",
      options: [
        { text: "Facing straight at the viewer", correct: false },
        { text: "Shown from behind", correct: false },
        { text: "Turned to show a side view", correct: true },
        { text: "Shown from above, looking down", correct: false }
      ]
    }
  ];

  var current = 0;
  var score = 0;
  var answered = false;
  var root = document.getElementById('quiz-root');

  function render() {
    root.innerHTML = '';
    if (current >= questions.length) { renderResults(); return; }
    answered = false;
    var q = questions[current];

    var progress = document.createElement('div');
    progress.className = 'progress';
    questions.forEach(function (_, i) {
      var dot = document.createElement('div');
      dot.className = 'dot' + (i < current ? ' done' : (i === current ? ' current' : ''));
      progress.appendChild(dot);
    });
    root.appendChild(progress);

    var counter = document.createElement('p');
    counter.className = 'counter';
    counter.textContent = 'Question ' + (current + 1) + ' of ' + questions.length;
    root.appendChild(counter);

    var word = document.createElement('p');
    word.className = 'word';
    word.textContent = q.word;
    root.appendChild(word);

    var prompt = document.createElement('p');
    prompt.className = 'prompt';
    prompt.textContent = q.prompt;
    root.appendChild(prompt);

    var optionsWrap = document.createElement('div');
    optionsWrap.className = 'options';

    var feedback = document.createElement('div');
    feedback.className = 'feedback';

    var nextBtn = document.createElement('button');
    nextBtn.className = 'next';
    nextBtn.textContent = current === questions.length - 1 ? 'See results' : 'Next question';
    nextBtn.onclick = function () { current++; render(); };

    q.options.forEach(function (opt) {
      var btn = document.createElement('button');
      btn.className = 'option';
      btn.textContent = opt.text;
      btn.onclick = function () {
        if (answered) return;
        answered = true;
        Array.prototype.forEach.call(optionsWrap.children, function (b) { b.disabled = true; });
        if (opt.correct) {
          score++;
          btn.classList.add('correct');
          feedback.classList.add('good');
        } else {
          btn.classList.add('incorrect');
          feedback.classList.add('bad');
          var correctIndex = q.options.findIndex(function (o) { return o.correct; });
          var correctBtn = optionsWrap.children[correctIndex];
          if (correctBtn) correctBtn.classList.add('correct');
        }
        feedback.textContent = q.explanation;
        nextBtn.style.display = 'inline-block';
      };
      optionsWrap.appendChild(btn);
    });

    root.appendChild(optionsWrap);
    root.appendChild(feedback);
    root.appendChild(nextBtn);
  }

  function renderResults() {
    root.innerHTML = '';
    var scoreEl = document.createElement('p');
    scoreEl.className = 'score';
    scoreEl.textContent = 'Score: ' + score + ' of ' + questions.length;
    root.appendChild(scoreEl);

    questions.forEach(function (q) {
      var row = document.createElement('div');
      row.className = 'review-row';
      var w = document.createElement('p');
      w.className = 'review-word';
      w.textContent = q.word;
      var d = document.createElement('p');
      d.className = 'review-def';
      d.textContent = q.options.find(function (o) { return o.correct; }).text;
      row.appendChild(w);
      row.appendChild(d);
      root.appendChild(row);
    });

    var restart = document.createElement('button');
    restart.className = 'restart';
    restart.textContent = 'Try again';
    restart.onclick = function () { current = 0; score = 0; render(); };
    root.appendChild(restart);
  }

  render();
})();
</script>
</body>
</html>
