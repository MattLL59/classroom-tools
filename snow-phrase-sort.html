<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snow and Everest phrase sort</title>
<style>
  :root{;p
    --snow:#EDF1F4; --slate:#2E3B48; --ink:#1F2A33; --calm:#A9CBE0; --calmInk:#1D4D6B;
    --danger:#E9B3A6; --dangerInk:#7A2E1E; --muted:#5E6B76;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;background:var(--snow);color:var(--ink);display:flex;flex-direction:column}
  header{padding:18px 24px 6px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
  h1{margin:0;font-size:clamp(1.5rem,3vw,2.3rem);color:var(--slate)}
  .score{font-size:1.3rem;color:var(--muted)}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 20px 28px;gap:24px}
  .count{color:var(--muted);font-size:1.1rem}
  .phrase{background:#fff;border:2px solid #C9D3DB;border-radius:14px;padding:clamp(20px,4vw,44px);max-width:900px;width:100%;text-align:center;font-size:clamp(1.7rem,4.5vw,3.2rem);line-height:1.25}
  .buttons{display:flex;gap:20px;width:100%;max-width:900px}
  button{flex:1;font:inherit;font-size:clamp(1.4rem,3.5vw,2.2rem);font-weight:bold;padding:22px 10px;border-radius:14px;border:3px solid transparent;cursor:pointer}
  button:focus-visible{outline:4px solid var(--slate);outline-offset:3px}
  .calm{background:var(--calm);color:var(--calmInk)}
  .danger{background:var(--danger);color:var(--dangerInk)}
  .next{flex:none;background:var(--slate);color:#fff;font-size:1.4rem;padding:14px 36px}
  .feedback{max-width:900px;width:100%;font-size:clamp(1.2rem,2.6vw,1.6rem);line-height:1.4;min-height:3em;text-align:center}
  .right{color:#2F6B3A}.wrong{color:var(--dangerInk)}
  .hidden{display:none}
  .end{text-align:center;font-size:1.6rem;max-width:800px}
  @media (prefers-reduced-motion:no-preference){.phrase{transition:transform .2s}.phrase.pop{transform:scale(1.03)}}
  .pick{background:#fff;color:var(--slate);border:2px solid #C9D3DB}
  .pick small{font-weight:normal;font-size:.7em}
  .c1{background:#C9D9C2;color:#2F4F2A}
  .c2{background:var(--calm);color:var(--calmInk)}
  .c3{background:var(--danger);color:var(--dangerInk)}
  .menu{width:100%;max-width:900px;text-align:center}
  @media (max-width:600px){.buttons{flex-direction:column}}
</style>
</head>
<body>
<header>
  <h1 id="h1">Snow and Everest phrase sort</h1>
  <div class="score" id="score"></div>
</header>
<main>
  <div class="menu" id="menu">
    <p class="count">Which question is your class working on?</p>
    <div class="buttons">
      <button class="pick" data-deck="q2">Question 2<br><small>wind, cold or noise?</small></button>
      <button class="pick" data-deck="q4">Question 4<br><small>see, hear or feel?</small></button>
      <button class="pick" data-deck="q6">Question 6<br><small>calm or danger?</small></button>
    </div>
  </div>
  <div class="count hidden" id="count"></div>
  <div class="phrase hidden" id="phrase"></div>
  <div class="buttons hidden" id="buttons"></div>
  <div class="feedback" id="fb" aria-live="polite"></div>
  <button class="next hidden" id="next">Next phrase</button>
  <div class="end hidden" id="end"></div>
</main>
<script>
// Every phrase is quoted from the department's copy of the two exam extracts. Line numbers match the line-numbered source sheets.
const DECKS={"q6": [{"p": "Nothing could be more beautiful", "a": "calm", "t": "London Snow", "line": 2}, {"p": "a blinding fury of driving snow", "a": "danger", "t": "The Death Zone", "line": 21}, {"p": "absolute silence", "a": "calm", "t": "London Snow", "line": 15}, {"p": "a constant, bullying force", "a": "danger", "t": "The Death Zone", "line": 40}, {"p": "It fell without force or sound", "a": "calm", "t": "London Snow", "line": 18}, {"p": "a sinister howl", "a": "danger", "t": "The Death Zone", "line": 54}, {"p": "the wondrous lovely scene", "a": "calm", "t": "London Snow", "line": 20}, {"p": "the scream of the storm", "a": "danger", "t": "The Death Zone", "line": 55}, {"p": "the loveliness and utter purity of new-fallen snow", "a": "calm", "t": "London Snow", "line": 17}, {"p": "fighting for their lives", "a": "danger", "t": "The Death Zone", "line": 58}, {"p": "My beard froze", "a": "danger", "t": "London Snow", "line": 35}, {"p": "the raging white-out of the blizzard", "a": "danger", "t": "The Death Zone", "line": 50}, {"p": "I was almost helpless", "a": "danger", "t": "London Snow", "line": 38}, {"p": "an exquisite tracery of white branches", "a": "calm", "t": "London Snow", "line": 4}], "q2": [{"p": "a constant, bullying force", "a": "wind", "t": "The Death Zone", "line": 40}, {"p": "like living in a freezer", "a": "cold", "t": "The Death Zone", "line": 3}, {"p": "a sinister howl", "a": "noise", "t": "The Death Zone", "line": 54}, {"p": "pulling guy ropes from the glacier ice", "a": "wind", "t": "The Death Zone", "line": 41}, {"p": "The temperature fell to ten degrees below freezing", "a": "cold", "t": "The Death Zone", "line": 39}, {"p": "the scream of the storm", "a": "noise", "t": "The Death Zone", "line": 55}, {"p": "demolishing our canvas mess tent with frightening ease", "a": "wind", "t": "The Death Zone", "line": 43}, {"p": "Shivering with the cold", "a": "cold", "t": "The Death Zone", "line": 3}, {"p": "the tempestuous roar of the wind", "a": "noise", "t": "The Death Zone", "line": 52}, {"p": "creaked and groaned under the beating", "a": "noise", "t": "The Death Zone", "line": 44}], "q4": [{"p": "an exquisite tracery of white branches", "a": "sight", "t": "London Snow", "line": 4}, {"p": "absolute silence", "a": "sound", "t": "London Snow", "line": 15}, {"p": "My beard froze", "a": "feeling", "t": "London Snow", "line": 35}, {"p": "their gable roofs white against a clear sky", "a": "sight", "t": "London Snow", "line": 21}, {"p": "It fell without force or sound", "a": "sound", "t": "London Snow", "line": 18}, {"p": "as cold as a frog", "a": "feeling", "t": "London Snow", "line": 47}, {"p": "like the foam of a waterfall", "a": "sight", "t": "London Snow", "line": 31}, {"p": "people in thick coats and wrappers stepped noiselessly along", "a": "sound", "t": "London Snow", "line": 10}, {"p": "I was almost helpless", "a": "feeling", "t": "London Snow", "line": 38}, {"p": "a thick brown fog brooded over it", "a": "sight", "t": "London Snow", "line": 41}]};
const CATS={q2:[["wind","Wind","c1"],["cold","Cold","c2"],["noise","Noise","c3"]],q4:[["sight","See","c1"],["sound","Hear","c2"],["feeling","Feel","c3"]],q6:[["calm","Calm","c2"],["danger","Danger","c3"]]};
const TITLES={q2:"Wind, cold or noise?",q4:"See, hear or feel?",q6:"Calm or danger?"};
let deck,items,i=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function start(k){deck=k;items=DECKS[k];i=0;score=0;
  $("h1").textContent=TITLES[k];$("menu").classList.add("hidden");
  ["count","phrase","buttons"].forEach(x=>$(x).classList.remove("hidden"));$("end").classList.add("hidden");
  $("buttons").innerHTML="";CATS[k].forEach(([v,lab,cls],n)=>{const b=document.createElement("button");b.className=cls;b.textContent=`${lab} (${n+1})`;b.onclick=()=>pick(v);$("buttons").appendChild(b);});
  $("score").textContent="Score: 0";show();}
function show(){answered=false;const it=items[i];
  $("count").textContent=`Phrase ${i+1} of ${items.length}`;$("phrase").textContent="\u201C"+it.p+"\u201D";
  $("fb").textContent="";$("fb").className="feedback";$("next").classList.add("hidden");$("buttons").classList.remove("hidden");}
function pick(v){if(answered)return;answered=true;const it=items[i];const ok=v===it.a;
  if(ok){score++;$("score").textContent="Score: "+score;}
  const lab=CATS[deck].find(c=>c[0]===it.a)[1].toLowerCase();
  let msg=(ok?"Yes! ":"Not quite. ")+`It's ${lab}. Find it in ${it.t}, line ${it.line}.`;
  if(deck==="q6"&&it.t==="London Snow"&&it.a==="danger")msg+=" Surprise: Munby suffers in the cold too. That's a similarity!";
  $("fb").textContent=msg;$("fb").classList.add(ok?"right":"wrong");
  $("next").textContent=i===items.length-1?"See my score":"Next phrase";$("next").classList.remove("hidden");$("next").focus();}
function next(){i++;if(i>=items.length){["buttons","phrase","count","next"].forEach(x=>$(x).classList.add("hidden"));$("fb").textContent="";
  $("end").innerHTML=`You scored <strong>${score} out of ${items.length}</strong>.<br><br>Which phrase would you use in your answer?<br><br><button class="next" onclick="start(deck)">Play again</button> <button class="next" onclick="location.hash='';location.reload()">Change question</button>`;
  $("end").classList.remove("hidden");return;}show();}
$("next").onclick=next;
document.querySelectorAll(".pick").forEach(b=>b.onclick=()=>start(b.dataset.deck));
document.addEventListener("keydown",e=>{if(!deck)return;const n=parseInt(e.key);const c=CATS[deck];if(n>=1&&n<=c.length)pick(c[n-1][0]);});
const h=location.hash.replace("#","");if(DECKS[h])start(h);
</script>
</body>
</html>
