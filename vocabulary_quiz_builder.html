<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Quiz Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDEAE1;
    --card: #FAF8F3;
    --ink: #262B22;
    --ink-soft: #5B6156;
    --line: #D9D4C6;
    --accent: #4B5C4A;
    --good: #3F6B4A;
    --good-bg: #E4EFE3;
    --good-border: #A9C7A7;
    --bad: #96432F;
    --bad-bg: #F3E4DE;
    --bad-border: #DDB4A4;
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: var(--font-sans); color: var(--ink); }
  .page { max-width: 640px; margin: 0 auto; padding: 48px 24px 64px; }
  header { text-align: center; margin-bottom: 28px; }
  .eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 8px; }
  h1 { font-family: var(--font-display); font-weight: 500; font-size: 28px; margin: 0 0 10px; }
  .subtitle { font-size: 13px; color: var(--ink-soft); margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .frame-top { height: 14px; border-bottom: 1px solid var(--line); background-image: repeating-linear-gradient(90deg, var(--line) 0, var(--line) 1px, transparent 1px, transparent 48px); }
  #app-root { padding: 28px 28px 32px; }

  /* Builder */
  .setup-intro { font-size: 14px; color: var(--ink-soft); margin: 0 0 20px; line-height: 1.5; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
  .btn { font-family: var(--font-sans); font-size: 13px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn-danger { color: var(--bad); border-color: var(--bad-border); background: var(--bad-bg); font-size: 12px; padding: 6px 10px; }
  .btn-danger:hover { border-color: var(--bad); }
  .cards-wrap { display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px; }
  .q-card { border: 1px solid var(--line); border-radius: 12px; padding: 18px; background: #fff; }
  .q-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .q-card-header span { font-family: var(--font-display); font-size: 15px; font-weight: 500; }
  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); margin-bottom: 5px; }
  .field input { width: 100%; font-family: var(--font-sans); font-size: 14px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .field.invalid input { border-color: var(--bad-border); background: var(--bad-bg); }
  .field-error { font-size: 12px; color: var(--bad); margin: 4px 0 0; }
  .field-hint { font-size: 11px; color: var(--ink-soft); margin: 4px 0 0; }
  .add-word-btn { width: 100%; padding: 12px; border-style: dashed; margin-bottom: 16px; background: transparent; }
  .empty-state { text-align: center; padding: 24px 12px; color: var(--ink-soft); font-size: 14px; margin-bottom: 16px; border: 1px dashed var(--line); border-radius: 12px; }
  .error-text { color: var(--bad); font-size: 13px; margin: 0 0 14px; }
  .file-input { display: none; }

  /* Share link panel */
  .share-panel { border: 1px solid var(--good-border); background: var(--good-bg); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
  .share-label { font-size: 13px; color: var(--good); margin: 0 0 10px; font-weight: 500; }
  .share-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .share-input { flex: 1; min-width: 180px; font-family: var(--font-sans); font-size: 13px; padding: 9px 12px; border: 1px solid var(--good-border); border-radius: 8px; background: #fff; color: var(--ink); }
  .share-hint { font-size: 11px; color: var(--ink-soft); margin: 8px 0 0; }

  /* Shared quiz UI */
  .edit-link { display: inline-block; font-size: 13px; color: var(--ink-soft); text-decoration: underline; cursor: pointer; margin-bottom: 18px; background: none; border: none; padding: 0; font-family: var(--font-sans); }
  .progress { display: flex; gap: 6px; margin-bottom: 20px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .dot.done { background: var(--accent); }
  .dot.current { background: var(--ink); }
  .counter { font-size: 12px; color: var(--ink-soft); margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  .word { font-family: var(--font-display); font-size: 24px; font-weight: 500; margin: 0 0 6px; }
  .prompt { font-size: 15px; color: var(--ink-soft); margin: 0 0 18px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option { text-align: left; font-family: var(--font-sans); font-size: 15px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); cursor: pointer; transition: border-color .15s, background .15s; }
  .option:hover:not(:disabled) { border-color: var(--accent); }
  .option:disabled { cursor: default; }
  .option.correct { background: var(--good-bg); border-color: var(--good-border); color: var(--good); }
  .option.incorrect { background: var(--bad-bg); border-color: var(--bad-border); color: var(--bad); }
  .feedback { margin-top: 16px; padding: 12px 16px; border-radius: 10px; font-size: 14px; display: none; border-left: 3px solid currentColor; }
  .feedback.good { display: block; background: var(--good-bg); color: var(--good); }
  .feedback.bad { display: block; background: var(--bad-bg); color: var(--bad); }
  .next { margin-top: 20px; display: none; font-family: var(--font-sans); font-size: 14px; font-weight: 500; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; }
  .next:hover { opacity: 0.9; }
  .start-btn { display: inline-block; margin-top: 4px; font-family: var(--font-sans); font-size: 14px; font-weight: 500; padding: 11px 20px; border-radius: 8px; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; }
  .start-btn:hover { opacity: 0.9; }
  .score { font-family: var(--font-display); font-size: 22px; margin: 0 0 18px; }
  .review-row { padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; background: #fff; }
  .review-word { font-weight: 600; margin: 0 0 2px; font-size: 14px; }
  .review-def { margin: 0; font-size: 13px; color: var(--ink-soft); }
  .results-actions { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="page">
  <header>
    <p class="eyebrow" id="page-eyebrow">Vocabulary quiz builder</p>
    <h1 id="page-title">Build your own vocabulary check</h1>
    <p class="subtitle" id="page-subtitle">Add words, correct definitions and wrong answers, then play</p>
  </header>
  <div class="card">
    <div class="frame-top"></div>
    <div id="app-root"></div>
  </div>
</div>
<input type="file" id="file-input" class="file-input" accept="application/json,.json">

<script>
(function () {
  var root = document.getElementById('app-root');
  var fileInput = document.getElementById('file-input');

  // ---------- base64url helpers (unicode-safe) ----------
  function toBase64Url(str) {
    var utf8 = unescape(encodeURIComponent(str));
    var b64 = btoa(utf8);
    return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function fromBase64Url(b64url) {
    var b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var utf8 = atob(b64);
    return decodeURIComponent(escape(utf8));
  }

  function parseSharedData() {
    try {
      var params = new URLSearchParams(window.location.search);
      var d = params.get('d');
      if (!d) return null;
      var json = fromBase64Url(d);
      var data = JSON.parse(json);
      if (!data.e || !Array.isArray(data.e) || data.e.length === 0) return null;
      return data.e.map(function (en) {
        return {
          word: en.w || '', prompt: en.p || '', correct: en.c || '',
          d1: en.d1 || '', d2: en.d2 || '', d3: en.d3 || '', note: en.n || ''
        };
      });
    } catch (err) {
      return null;
    }
  }

  var sharedEntries = parseSharedData();
  var isSharedMode = !!sharedEntries;

  var idCounter = 0;
  var entries = [];
  var mode = 'setup'; // 'setup' | 'quiz' | 'results'
  var formError = '';
  var shareUrl = '';

  var quizQuestions = [];
  var current = 0;
  var score = 0;
  var answered = false;

  if (isSharedMode) {
    document.getElementById('page-eyebrow').textContent = 'Vocabulary check';
    document.getElementById('page-title').textContent = 'Test your vocabulary';
    document.getElementById('page-subtitle').textContent = '';
    document.title = 'Vocabulary Check';
  }

  function newEntry() {
    idCounter++;
    return { id: 'e' + idCounter, word: '', prompt: '', correct: '', d1: '', d2: '', d3: '', note: '', errors: {} };
  }

  function addEntry() {
    entries.push(newEntry());
    shareUrl = '';
  }

  function removeEntry(id) {
    entries = entries.filter(function (e) { return e.id !== id; });
    shareUrl = '';
  }

  if (!isSharedMode) {
    // start with three blank cards so it's obvious what to do
    addEntry(); addEntry(); addEntry();
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function validateEntries() {
    var valid = true;
    entries.forEach(function (e) {
      e.errors = {};
      if (!e.word.trim()) { e.errors.word = 'Enter the word or phrase.'; valid = false; }
      if (!e.correct.trim()) { e.errors.correct = 'Enter the correct definition.'; valid = false; }
      if (!e.d1.trim()) { e.errors.d1 = 'Enter at least one wrong answer.'; valid = false; }
    });
    if (entries.length === 0) valid = false;
    return valid;
  }

  function render() {
    if (mode === 'setup') renderSetup();
    else if (mode === 'quiz') renderQuiz();
    else renderResults();
  }

  // ---------- Setup screen ----------
  function renderSetup() {
    root.innerHTML = '';

    var intro = document.createElement('p');
    intro.className = 'setup-intro';
    intro.textContent = 'Add each word, its correct definition, and at least one wrong answer. Load a saved list to reuse it, save this one for next time, or get a link that sends students straight to the quiz.';
    root.appendChild(intro);

    var toolbar = document.createElement('div');
    toolbar.className = 'toolbar';
    var loadBtn = document.createElement('button');
    loadBtn.type = 'button'; loadBtn.className = 'btn'; loadBtn.textContent = 'Load saved list';
    loadBtn.onclick = function () { fileInput.click(); };
    var saveBtn = document.createElement('button');
    saveBtn.type = 'button'; saveBtn.className = 'btn'; saveBtn.textContent = 'Save this list';
    saveBtn.onclick = saveToFile;
    var linkBtn = document.createElement('button');
    linkBtn.type = 'button'; linkBtn.className = 'btn'; linkBtn.textContent = 'Get student link';
    linkBtn.onclick = handleGetLink;
    toolbar.appendChild(loadBtn);
    toolbar.appendChild(saveBtn);
    toolbar.appendChild(linkBtn);
    root.appendChild(toolbar);

    if (shareUrl) {
      var sharePanel = document.createElement('div');
      sharePanel.className = 'share-panel';
      var shareLabel = document.createElement('p');
      shareLabel.className = 'share-label';
      shareLabel.textContent = 'Share this link with students \u2014 it opens straight to the quiz:';
      var shareRow = document.createElement('div');
      shareRow.className = 'share-row';
      var shareInput = document.createElement('input');
      shareInput.type = 'text'; shareInput.readOnly = true; shareInput.value = shareUrl; shareInput.className = 'share-input';
      shareInput.onclick = function () { shareInput.select(); };
      var copyBtn = document.createElement('button');
      copyBtn.type = 'button'; copyBtn.className = 'btn'; copyBtn.textContent = 'Copy link';
      copyBtn.onclick = function () { copyToClipboard(shareUrl, copyBtn); };
      shareRow.appendChild(shareInput);
      shareRow.appendChild(copyBtn);
      sharePanel.appendChild(shareLabel);
      sharePanel.appendChild(shareRow);
      var shareHint = document.createElement('p');
      shareHint.className = 'share-hint';
      shareHint.textContent = shareUrl.length > 1800
        ? ('This link is quite long (' + shareUrl.length + ' characters) \u2014 if sharing it causes problems, try fewer words or shorter definitions. If you change any words above, click "Get student link" again to refresh it.')
        : 'If you change any words above, click "Get student link" again to refresh it.';
      sharePanel.appendChild(shareHint);
      root.appendChild(sharePanel);
    }

    if (entries.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No words yet. Add one below to get started.';
      root.appendChild(empty);
    } else {
      var cardsWrap = document.createElement('div');
      cardsWrap.className = 'cards-wrap';
      entries.forEach(function (entry, index) {
        cardsWrap.appendChild(buildEntryCard(entry, index));
      });
      root.appendChild(cardsWrap);
    }

    var addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'btn add-word-btn';
    addBtn.textContent = '+ Add another word';
    addBtn.onclick = function () { addEntry(); renderSetup(); };
    root.appendChild(addBtn);

    if (formError) {
      var err = document.createElement('p');
      err.className = 'error-text';
      err.textContent = formError;
      root.appendChild(err);
    }

    var startBtn = document.createElement('button');
    startBtn.type = 'button';
    startBtn.className = 'start-btn';
    startBtn.textContent = 'Start quiz';
    startBtn.onclick = handleStart;
    root.appendChild(startBtn);
  }

  function field(labelText, value, onInput, opts) {
    opts = opts || {};
    var wrap = document.createElement('div');
    wrap.className = 'field' + (opts.error ? ' invalid' : '');
    var label = document.createElement('label');
    var inputId = opts.id || ('f' + Math.random().toString(36).slice(2));
    label.setAttribute('for', inputId);
    label.textContent = labelText;
    var input = document.createElement('input');
    input.type = 'text';
    input.id = inputId;
    input.value = value;
    if (opts.placeholder) input.placeholder = opts.placeholder;
    input.oninput = function (e) { onInput(e.target.value); };
    wrap.appendChild(label);
    wrap.appendChild(input);
    if (opts.error) {
      var err = document.createElement('p');
      err.className = 'field-error';
      err.textContent = opts.error;
      wrap.appendChild(err);
    } else if (opts.hint) {
      var hint = document.createElement('p');
      hint.className = 'field-hint';
      hint.textContent = opts.hint;
      wrap.appendChild(hint);
    }
    return wrap;
  }

  function buildEntryCard(entry, index) {
    var card = document.createElement('div');
    card.className = 'q-card';

    var head = document.createElement('div');
    head.className = 'q-card-header';
    var title = document.createElement('span');
    title.textContent = 'Word ' + (index + 1);
    var removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'btn-danger';
    removeBtn.textContent = 'Remove';
    removeBtn.onclick = function () { removeEntry(entry.id); renderSetup(); };
    head.appendChild(title);
    head.appendChild(removeBtn);
    card.appendChild(head);

    card.appendChild(field('Word or phrase', entry.word, function (v) { entry.word = v; }, {
      id: 'word-' + entry.id, error: entry.errors.word, placeholder: 'e.g. Tranquil'
    }));
    card.appendChild(field('Question (optional)', entry.prompt, function (v) { entry.prompt = v; }, {
      id: 'prompt-' + entry.id,
      hint: 'Leave blank to use "' + (entry.word.trim() || '\u2026') + ' most nearly means..."'
    }));
    card.appendChild(field('Correct definition', entry.correct, function (v) { entry.correct = v; }, {
      id: 'correct-' + entry.id, error: entry.errors.correct, placeholder: 'The right answer'
    }));
    card.appendChild(field('Wrong answer 1', entry.d1, function (v) { entry.d1 = v; }, {
      id: 'd1-' + entry.id, error: entry.errors.d1, placeholder: 'A plausible wrong answer'
    }));
    card.appendChild(field('Wrong answer 2 (optional)', entry.d2, function (v) { entry.d2 = v; }, {
      id: 'd2-' + entry.id
    }));
    card.appendChild(field('Wrong answer 3 (optional)', entry.d3, function (v) { entry.d3 = v; }, {
      id: 'd3-' + entry.id
    }));
    card.appendChild(field('Note shown after answering (optional)', entry.note, function (v) { entry.note = v; }, {
      id: 'note-' + entry.id, placeholder: 'A short explanation, if you want one'
    }));

    return card;
  }

  function handleStart() {
    var valid = validateEntries();
    if (!valid) {
      formError = entries.length === 0
        ? 'Add at least one word before starting.'
        : 'Please fill in the highlighted fields before starting.';
      renderSetup();
      return;
    }
    formError = '';
    quizQuestions = entries.map(buildQuizQuestion);
    shuffle(quizQuestions);
    mode = 'quiz';
    current = 0;
    score = 0;
    render();
  }

  function handleGetLink() {
    var valid = validateEntries();
    if (!valid) {
      formError = entries.length === 0
        ? 'Add at least one word before creating a link.'
        : 'Please fill in the highlighted fields before creating a link.';
      shareUrl = '';
      renderSetup();
      return;
    }
    formError = '';
    var compact = {
      e: entries.map(function (e) {
        var obj = { w: e.word.trim(), c: e.correct.trim(), d1: e.d1.trim() };
        if (e.prompt && e.prompt.trim()) obj.p = e.prompt.trim();
        if (e.d2 && e.d2.trim()) obj.d2 = e.d2.trim();
        if (e.d3 && e.d3.trim()) obj.d3 = e.d3.trim();
        if (e.note && e.note.trim()) obj.n = e.note.trim();
        return obj;
      })
    };
    var encoded = toBase64Url(JSON.stringify(compact));
    shareUrl = window.location.origin + window.location.pathname + '?d=' + encoded;
    renderSetup();
  }

  function copyToClipboard(text, btn) {
    var original = btn.textContent;
    function done(ok) {
      btn.textContent = ok ? 'Copied!' : 'Copy failed \u2014 select and copy manually';
      setTimeout(function () { btn.textContent = original; }, 1800);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }).catch(function () { done(false); });
    } else {
      try {
        var temp = document.createElement('textarea');
        temp.value = text;
        temp.style.position = 'fixed';
        temp.style.opacity = '0';
        document.body.appendChild(temp);
        temp.focus();
        temp.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(temp);
        done(ok);
      } catch (err) {
        done(false);
      }
    }
  }

  function buildQuizQuestion(e) {
    var options = [{ text: e.correct.trim(), correct: true }];
    [e.d1, e.d2, e.d3].forEach(function (d) {
      if (d && d.trim()) options.push({ text: d.trim(), correct: false });
    });
    shuffle(options);
    return {
      word: e.word.trim(),
      prompt: (e.prompt && e.prompt.trim()) || (e.word.trim() + ' most nearly means...'),
      note: e.note && e.note.trim() ? e.note.trim() : null,
      options: options
    };
  }

  // ---------- Save / load ----------
  function saveToFile() {
    var data = {
      app: 'vocabulary-quiz-builder',
      version: 1,
      savedAt: new Date().toISOString(),
      entries: entries.map(function (e) {
        return { word: e.word, prompt: e.prompt, correct: e.correct, d1: e.d1, d2: e.d2, d3: e.d3, note: e.note };
      })
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'vocabulary-list.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  fileInput.addEventListener('change', function (event) {
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var data = JSON.parse(e.target.result);
        if (!data.entries || !Array.isArray(data.entries) || data.entries.length === 0) {
          throw new Error('No entries found');
        }
        entries = data.entries.map(function (en) {
          idCounter++;
          return {
            id: 'e' + idCounter,
            word: en.word || '', prompt: en.prompt || '', correct: en.correct || '',
            d1: en.d1 || '', d2: en.d2 || '', d3: en.d3 || '', note: en.note || '',
            errors: {}
          };
        });
        formError = '';
        shareUrl = '';
        renderSetup();
      } catch (err) {
        formError = "That file doesn't look like a saved vocabulary list.";
        renderSetup();
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  });

  // ---------- Quiz screen ----------
  function renderQuiz() {
    root.innerHTML = '';
    if (current >= quizQuestions.length) { mode = 'results'; renderResults(); return; }
    answered = false;
    var q = quizQuestions[current];

    if (!isSharedMode) root.appendChild(editLink());

    var progress = document.createElement('div');
    progress.className = 'progress';
    quizQuestions.forEach(function (_, i) {
      var dot = document.createElement('div');
      dot.className = 'dot' + (i < current ? ' done' : (i === current ? ' current' : ''));
      progress.appendChild(dot);
    });
    root.appendChild(progress);

    var counter = document.createElement('p');
    counter.className = 'counter';
    counter.textContent = 'Question ' + (current + 1) + ' of ' + quizQuestions.length;
    root.appendChild(counter);

    var word = document.createElement('p');
    word.className = 'word';
    word.textContent = q.word;
    root.appendChild(word);

    var prompt = document.createElement('p');
    prompt.className = 'prompt';
    prompt.textContent = q.prompt;
    root.appendChild(prompt);

    var optionsWrap = document.createElement('div');
    optionsWrap.className = 'options';

    var feedback = document.createElement('div');
    feedback.className = 'feedback';

    var nextBtn = document.createElement('button');
    nextBtn.className = 'next';
    nextBtn.textContent = current === quizQuestions.length - 1 ? 'See results' : 'Next question';
    nextBtn.onclick = function () { current++; render(); };

    q.options.forEach(function (opt) {
      var btn = document.createElement('button');
      btn.className = 'option';
      btn.textContent = opt.text;
      btn.onclick = function () {
        if (answered) return;
        answered = true;
        Array.prototype.forEach.call(optionsWrap.children, function (b) { b.disabled = true; });
        var message;
        if (opt.correct) {
          score++;
          btn.classList.add('correct');
          feedback.classList.add('good');
          message = q.note ? q.note : "That's right.";
        } else {
          btn.classList.add('incorrect');
          feedback.classList.add('bad');
          var correctIndex = q.options.findIndex(function (o) { return o.correct; });
          var correctBtn = optionsWrap.children[correctIndex];
          if (correctBtn) correctBtn.classList.add('correct');
          message = (q.note ? q.note + ' ' : '') + 'Correct answer: ' + q.options[correctIndex].text;
        }
        feedback.textContent = message;
        nextBtn.style.display = 'inline-block';
      };
      optionsWrap.appendChild(btn);
    });

    root.appendChild(optionsWrap);
    root.appendChild(feedback);
    root.appendChild(nextBtn);
  }

  function editLink() {
    var link = document.createElement('button');
    link.type = 'button';
    link.className = 'edit-link';
    link.textContent = '\u2190 Edit words';
    link.onclick = function () { mode = 'setup'; render(); };
    return link;
  }

  // ---------- Results screen ----------
  function renderResults() {
    root.innerHTML = '';

    var scoreEl = document.createElement('p');
    scoreEl.className = 'score';
    scoreEl.textContent = 'Score: ' + score + ' of ' + quizQuestions.length;
    root.appendChild(scoreEl);

    quizQuestions.forEach(function (q) {
      var row = document.createElement('div');
      row.className = 'review-row';
      var w = document.createElement('p');
      w.className = 'review-word';
      w.textContent = q.word;
      var d = document.createElement('p');
      d.className = 'review-def';
      d.textContent = q.options.find(function (o) { return o.correct; }).text;
      row.appendChild(w);
      row.appendChild(d);
      root.appendChild(row);
    });

    var actions = document.createElement('div');
    actions.className = 'results-actions';

    var retry = document.createElement('button');
    retry.className = 'btn';
    retry.textContent = 'Play again';
    retry.onclick = function () { shuffle(quizQuestions); current = 0; score = 0; mode = 'quiz'; render(); };
    actions.appendChild(retry);

    if (!isSharedMode) {
      var editBtn = document.createElement('button');
      editBtn.className = 'btn';
      editBtn.textContent = 'Edit words';
      editBtn.onclick = function () { mode = 'setup'; render(); };
      actions.appendChild(editBtn);
    }

    root.appendChild(actions);
  }

  // ---------- Init ----------
  if (isSharedMode) {
    quizQuestions = sharedEntries.map(buildQuizQuestion);
    shuffle(quizQuestions);
    mode = 'quiz';
  }

  render();
})();
</script>
</body>
</html>
