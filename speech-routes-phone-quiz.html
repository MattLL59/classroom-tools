<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speech Quiz</title>
<style>
  :root { --navy:#1F2A44; --coral:#FF6F61; --yellow:#FFC845; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Calibri, Carlito, "Segoe UI", Arial, sans-serif; background:var(--navy); color:#fff; min-height:100vh; }
  .wrap { max-width:560px; margin:0 auto; padding:20px 18px 40px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  .bar { height:8px; background:rgba(255,255,255,.2); border-radius:4px; margin:10px 0 20px; }
  .fill { height:100%; background:var(--yellow); border-radius:4px; width:0; transition:width .3s; }
  .q { font-size:1.35rem; font-weight:bold; margin-bottom:16px; }
  button.opt { display:block; width:100%; text-align:left; font:inherit; font-size:1.15rem; padding:14px 16px; margin-bottom:10px; border:none; border-radius:12px; background:#fff; color:var(--navy); }
  button.opt.right { background:#7BD389; }
  button.opt.wrong { background:var(--coral); color:#fff; }
  .fb { min-height:1.6em; font-size:1.1rem; margin:8px 0 14px; }
  .next { font:inherit; font-size:1.2rem; font-weight:bold; padding:12px 30px; border:none; border-radius:30px; background:var(--yellow); color:var(--navy); display:none; }
  .end { text-align:center; font-size:1.4rem; }
  .big { font-size:3rem; font-weight:bold; color:var(--yellow); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Speech Quiz</h1>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div id="box"></div>
</div>
<script>
const QS = [
  { q: "Who is listening to your talk?", o: ["World leaders", "Your class", "A newspaper editor"], a: 1,
    why: "Eduqas talks are usually to your class, so talk to them: \u201Cyou\u201D and \u201Cwe\u201D." },
  { q: "What should your first sentence do?", o: ["Say hello and use the title from the question", "Give your last point", "Say thank you"], a: 0,
    why: "Copy the title words straight from the question." },
  { q: "Which word could start your first main point?", o: ["Finally", "Firstly", "Thank you"], a: 1,
    why: "Firstly, Secondly, Finally: one point per paragraph." },
  { q: "\u201CIn my class survey, 9 out of 10 people hate Mondays.\u201D This is a\u2026", o: ["Statistic", "Alliteration", "Rule of three"], a: 0,
    why: "Numbers backing up a point. In the exam you can make one up \u2014 just keep it believable." },
  { q: "Your sentence is 5 lines long. What should you do?", o: ["Keep going", "Put a full stop in", "Start again"], a: 1,
    why: "Mix short, medium and longer sentences. No huge ones." }
];
let i = 0, score = 0, answered = false;
const box = document.getElementById("box"), fill = document.getElementById("fill");
function render() {
  answered = false;
  fill.style.width = (i / QS.length * 100) + "%";
  const item = QS[i];
  box.innerHTML = '<div class="q">' + (i + 1) + ". " + item.q + '</div><div id="opts"></div><div class="fb" id="fb"></div><button class="next" id="nx">Next</button>';
  item.o.forEach((t, k) => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = t;
    b.onclick = () => choose(b, k);
    document.getElementById("opts").appendChild(b);
  });
  document.getElementById("nx").onclick = () => { i++; i < QS.length ? render() : finish(); };
}
function choose(b, k) {
  if (answered) return;
  answered = true;
  const item = QS[i], btns = document.querySelectorAll("button.opt");
  btns[item.a].classList.add("right");
  if (k === item.a) { score++; document.getElementById("fb").textContent = "Correct! " + item.why; }
  else { b.classList.add("wrong"); document.getElementById("fb").textContent = "Not quite. " + item.why; }
  document.getElementById("nx").style.display = "inline-block";
}
function finish() {
  fill.style.width = "100%";
  box.innerHTML = '<div class="end"><div class="big">' + score + " / " + QS.length + '</div><p>Now put your phone face down. Time to write Box 1.</p></div>';
}
render();
</script>
</body>
</html>
