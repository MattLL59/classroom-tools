<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snow and Everest: Phone Quiz</title>
<style>
  :root{--snow:#EDF1F4;--slate:#2E3B48;--ink:#1F2A33;--muted:#5E6B76;--ok:#CFE3D2;--okInk:#24542E;--no:#F1CFC6;--noInk:#7A2E1E}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;background:var(--snow);color:var(--ink)}
  .wrap{max-width:640px;margin:0 auto;padding:20px 18px 40px}
  h1{margin:0 0 4px;color:var(--slate);font-size:1.7rem}
  .meta{color:var(--muted);font-size:1.05rem;margin-bottom:18px}
  .text{display:inline-block;background:var(--slate);color:#fff;border-radius:8px;padding:3px 10px;font-size:1rem;margin-bottom:10px}
  .q{font-size:1.45rem;line-height:1.35;margin:0 0 16px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{font:inherit;font-size:1.25rem;text-align:left;padding:16px;border-radius:12px;border:2px solid #C9D3DB;background:#fff;color:var(--ink);cursor:pointer}
  .opt:focus-visible,.go:focus-visible{outline:4px solid var(--slate);outline-offset:2px}
  .opt.correct{background:var(--ok);border-color:var(--okInk);color:var(--okInk);font-weight:bold}
  .opt.picked-wrong{background:var(--no);border-color:var(--noInk);color:var(--noInk)}
  .fb{font-size:1.15rem;margin:14px 0;min-height:1.5em}
  .go{font:inherit;font-size:1.25rem;font-weight:bold;background:var(--slate);color:#fff;border:0;border-radius:12px;padding:14px 26px;cursor:pointer}
  .hidden{display:none}
  .done{font-size:1.4rem;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>Snow and Everest quiz</h1><p class="meta">Use your line-numbered texts to find the answers.</p>
  <div class="meta" id="meta"></div>
  <div id="card">
    <div class="text" id="src"></div>
    <p class="q" id="q"></p>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <button class="go hidden" id="go">Next question</button>
  </div>
  <div class="done hidden" id="done"></div>
</div>
<script>
// Line numbers match the line-numbered source sheets. Questions are worded exactly as on the department's exam paper (Q1a-c, Q3a-c).
const Q=[
 {s:"Source A: The Death Zone",q:"What is one of the names of the places near to base camp?",o:["The Khumbu glacier","The Strand","Victoria Street","Whitehall"],a:0,w:"Salkeld walks across the ice of the Khumbu glacier. Source A, line 5."},
 {s:"Source A: The Death Zone",q:"How many degrees did the storm cause the temperature to fall by?",o:["Five degrees","Ten to fifteen degrees","Forty degrees","One hundred degrees"],a:1,w:"Ten to fifteen degrees in as many seconds. Source A, line 20."},
 {s:"Source A: The Death Zone",q:"How many climbers had their oxygen levels running out?",o:["Thirty","Eight","Three","Five"],a:2,w:"Three Indian climbers. More than thirty were fighting for their lives, but that's a different number. Source A, line 58."},
 {s:"Source B: London Snow",q:"What street is described as being quiet and empty?",o:["Victoria Street","The Strand","The Mall","Garden Court"],a:1,w:"The Strand was as quiet and empty as a village street at nightfall. Source B, line 11."},
 {s:"Source B: London Snow",q:"How does one sweeper keep themselves warm?",o:["She sweeps faster","She stands by a fire","She stamps and blows on her fingers","She wears thick gloves"],a:2,w:"She stands stamping and blowing her fingers. Source B, line 33."},
 {s:"Source B: London Snow",q:"At what time of the day, on the 4th January, was the weather more intense?",o:["Breakfast time","Ten in the morning","Midday","4pm"],a:1,w:"The cold at ten this morning was more intense. Source B, line 34."}
];
let i=0,score=0,done=false;
const $=id=>document.getElementById(id);
function show(){
  done=false;const it=Q[i];
  $("meta").textContent=`Question ${i+1} of ${Q.length} \u00B7 Score ${score}`;
  $("src").textContent=it.s;$("q").textContent=it.q;$("fb").textContent="";$("go").classList.add("hidden");
  const box=$("opts");box.innerHTML="";
  it.o.forEach((t,k)=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>pick(k,b);box.appendChild(b);});
}
function pick(k,b){
  if(done)return;done=true;const it=Q[i];const btns=[...document.querySelectorAll(".opt")];
  btns[it.a].classList.add("correct");
  if(k===it.a){score++;$("fb").textContent="Correct! "+it.w;}else{b.classList.add("picked-wrong");$("fb").textContent="Not this time. "+it.w;}
  $("meta").textContent=`Question ${i+1} of ${Q.length} \u00B7 Score ${score}`;
  $("go").textContent=i===Q.length-1?"Finish":"Next question";$("go").classList.remove("hidden");$("go").focus();
}
$("go").onclick=()=>{i++;if(i<Q.length){show();return;}
  $("card").classList.add("hidden");$("meta").textContent="";
  $("done").innerHTML=`You scored <strong>${score} out of ${Q.length}</strong>.<br><br>These are real exam-style questions, worth a mark each. Nice work.<br><br>Now put your phone face down. \u{1F44D}`;
  $("done").classList.remove("hidden");};
show();
</script>
</body>
</html>
